# ---------------------------------------------------------
# Final correction for CATALINA_HOME paths outside
# /apps/install/asf-* or /apps/install/jws-*
# ---------------------------------------------------------

- name: Find correct CATALINA_HOME for invalid resolved paths
  ansible.builtin.shell: |
    set -o pipefail
    {
      ls -d /apps/install/asf-*/current 2>/dev/null
      ls -d /apps/install/jws-*/current 2>/dev/null
    } | grep -v native | head -1
  args:
    executable: /bin/bash
  loop: "{{ cat_real_by_inst | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value | default('') | trim != ''
    - item.value != 'Not_found'
    - not (item.value | trim).startswith('/apps/install/asf-')
    - not (item.value | trim).startswith('/apps/install/jws-')
  register: cat_real_final_fix
  changed_when: false
  failed_when: false
  become: true


- name: Correct final CATALINA_HOME path
  ansible.builtin.set_fact:
    cat_real_by_inst: >-
      {{
        cat_real_by_inst
        | combine({
            item.item.key: item.stdout | trim
          })
      }}
  loop: "{{ cat_real_final_fix.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"
  when:
    - not (item.skipped | default(false))
    - item.rc | default(1) == 0
    - item.stdout | default('') | trim != ''